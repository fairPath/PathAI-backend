name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Testcontainers needs Docker, which ubuntu-latest provides.
      - name: Run tests
        run: ./gradlew test --no-daemon

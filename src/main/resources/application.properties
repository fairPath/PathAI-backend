# Local .env is imported for every profile except 'test', so integration
# tests never pick up developer credentials. (A test-side override cannot
# cancel an import declared in this file, so the import itself is conditional.)
spring.config.activate.on-profile=!test
spring.config.import=optional:file:.env[.properties]
#---
spring.application.name=fair_path
spring.datasource.url= ${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase's transaction pooler (port 6543) cannot use named server prepared statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.sql.init.platform=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

# JWT secret key
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# App Password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Forgot Password UI URL
forgot.password.url=${env}/update-password

aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_RESUME_BUCKET}

# AI service (fairPath-ai-service), shared by every Spring -> AI service call.
# The token must match INTERNAL_TOKEN in the AI service's environment.
fairpath.ai-service.base-url=${FAIRPATH_AI_SERVICE_URL}
fairpath.ai-service.internal-token=${FAIRPATH_AI_INTERNAL_TOKEN}
fairpath.ai-service.connect-timeout=5s
# Placeholder; set from measured latency in hardening.
fairpath.ai-service.read-timeout=120s
# Wait before Analyze's single retry of a refused connection or a bare 503.
fairpath.ai-service.retry-delay=5s
fairpath.ai-service.max-error-body-bytes=8192

# Durable comparison worker: runs inside Spring, outside save requests.
fairpath.comparison-worker.enabled=${COMPARISON_WORKER_ENABLED:true}

# Comparison thresholds, the same two rules as Analysis. processing-stale-after is the lease length:
# it must exceed two 120-second calls plus the 5-second retry wait (checked at boot).
fairpath.comparison.pending-stale-after=10m
fairpath.comparison.processing-stale-after=300s

# Analysis thresholds for the sweep. pending-stale-after is measured from created_at,
# processing-stale-after from started_at.
fairpath.analysis.pending-stale-after=10m
fairpath.analysis.processing-stale-after=5m

# Shared scheduler (one thread per scheduled job: the sweep and account deletion) and the stranded-work sweep.
fairpath.maintenance.scheduler-threads=2
fairpath.maintenance.sweep-interval=1m
# Test-only switch (tests call the sweep directly). Never turn it off in production: nothing else recovers stuck work.
fairpath.maintenance.sweep-enabled=true

# Minimum wait after a completed Analysis before the next one (the Cooldown).
fairpath.analysis.cooldown=24h

# Independent fixed-size worker pools; both use AiRequestExecution and the same retry policy.
fairpath.ai-execution.analysis-threads=8
fairpath.ai-execution.comparison-threads=8

# Résumé uploads and durable account cleanup
fairpath.resume.upload-url-duration=15m
fairpath.account-deletion.scheduling-enabled=true
fairpath.account-deletion.poll-interval=2s
fairpath.account-deletion.upload-drain=1m
fairpath.account-deletion.retry-delay=30s
fairpath.account-deletion.operation-timeout=20s
fairpath.account-deletion.lease=60s
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Local .env is imported for every profile except 'test', so integration
# tests never pick up developer credentials. (A test-side override cannot
# cancel an import declared in this file, so the import itself is conditional.)
spring.config.activate.on-profile=!test
spring.config.import=optional:file:.env[.properties]
#---
spring.application.name=fair_path
spring.datasource.url= ${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase's transaction pooler (port 6543) cannot use named server prepared statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.sql.init.platform=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Ollama connection
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1:8b-instruct-q4_K_M
spring.ai.ollama.chat.options.temperature=0.7
# Embeddings
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.options.model=nomic-embed-text
server.port=8080
logging.level.org.springframework.ai=DEBUG

# JWT secret key
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# App Password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Forgot Password UI URL
forgot.password.url=${env}/update-password

aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_RESUME_BUCKET}

# AI service (fairPath-ai-service), shared by every Spring -> AI service call.
# The token must match INTERNAL_TOKEN in the AI service's environment.
fairpath.ai-service.base-url=${FAIRPATH_AI_SERVICE_URL}
fairpath.ai-service.internal-token=${FAIRPATH_AI_INTERNAL_TOKEN}
fairpath.ai-service.connect-timeout=5s
# Placeholder; set from measured latency in hardening.
fairpath.ai-service.read-timeout=120s

# Durable comparison worker: runs inside Spring, outside save requests.
fairpath.comparison-worker.enabled=${COMPARISON_WORKER_ENABLED:true}
fairpath.comparison-worker.poll-ms=1000

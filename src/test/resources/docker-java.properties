# Pins the Docker API version used by Testcontainers 1.20.x (managed by Spring Boot 3.4).
# Without it the client speaks API 1.32, which Docker Engine 29 rejects:
#   "client version 1.32 is too old. Minimum supported API version is 1.40"
# 1.44 needs Docker Engine 25 or newer. Drop this file once Testcontainers is upgraded
# (e.g. by moving to Spring Boot 3.5, which manages a newer version).
api.version=1.44

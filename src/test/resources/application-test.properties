# @ServiceConnection supplies the datasource, and an unresolved ${DB_URL}
# would fail loudly if that ever stopped working.
JWT_SECRET_KEY=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LWZvci1yZWFsLXVzZS0wMDA=
SUPPORT_EMAIL=test@example.invalid
APP_PASSWORD=test-not-a-real-password
APP_ID=test-app-id
APP_KEY=test-app-key
AWS_REGION=us-east-2
AWS_S3_RESUME_BUCKET=test-bucket
env=http://localhost:3000
# The saved-job comparison worker polls the database on a schedule. Integration
# tests drive the app through its REST API, so keep the worker out of them.
fairpath.comparison-worker.enabled=false
